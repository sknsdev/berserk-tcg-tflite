version: '3.8'

services:
  # Основной сервис для обучения и CLI команд
  card-recognition:
    build: .
    image: card-recognition
    container_name: card-training
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - .:/app
      - ./cards:/app/cards
      - ./cards_augmented:/app/cards_augmented
      - ./models:/app/models
    ports:
      - "5000:5000"
    stdin_open: true
    tty: true
    working_dir: /app
    command: python cli.py --help
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Сервис для веб-демо
  web-demo:
    build: .
    image: card-recognition
    container_name: card-web-demo
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    volumes:
      - .:/app
      - ./cards:/app/cards
      - ./models:/app/models
    ports:
      - "5000:5000"
    working_dir: /app
    command: python web_demo.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Сервис только для CPU (без GPU)
  card-recognition-cpu:
    build: .
    image: card-recognition
    container_name: card-training-cpu
    env_file:
      - .env
    volumes:
      - .:/app
      - ./cards:/app/cards
      - ./cards_augmented:/app/cards_augmented
      - ./models:/app/models
    ports:
      - "5001:5000"
    stdin_open: true
    tty: true
    working_dir: /app
    command: python cli.py --help
    profiles:
      - cpu-only